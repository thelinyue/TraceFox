[package]
name = "tracefox"
version = "0.0.1"
edition = "2024"
build = "build.rs"

[[bin]]
name = "TraceFox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1"
chrono = { version = "0.4", features = ["serde"] }
# 加速归档和轮转日志的解码，纯 Rust 后端不增加部署所需的 DLL。
flate2 = { version = "1", features = ["zlib-rs"] }
tar = "0.4"
notify = "8"
slint = { version = "~1.17", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030", "accessibility"] }
rfd = "0.15"
tray-icon = "0.21"
open = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Security_Credentials"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
url = "2"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_WinRT"] }
winreg = "0.55"

[build-dependencies]
slint-build = "~1.17"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

