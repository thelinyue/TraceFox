const report=/*REPORT_DATA*/null;
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n},button=(text,fn)=>{const n=el('button',text);n.type='button';n.onclick=fn;return n};
// 显示名统一取自日志目录，原有规则分组、证据路径和关联键保持原值。
const logCatalog=new Map(report.log_files.map(file=>[file.id,file]));
const catalogNames=ids=>(ids||[]).map(id=>logCatalog.get(id)?.name||'日志文件').join('、');

function storageHealth(t,rows){
    let status='未检测',checked=false;
    const reasons=[],rank={'未检测':0,'正常':1,'注意':2,'异常':3};
    const flag=(level,reason)=>{if(rank[level]>rank[status])status=level;reasons.push(reason)};
    const counters={reallocated_sector_ct:['注意','重映射扇区'],reallocated_sector_count:['注意','重映射扇区'],current_pending_sector:['异常','待处理扇区'],offline_uncorrectable:['异常','离线不可校正扇区']};
    for(const row of rows){
        const get=path=>{const field=t?.fields.find(f=>f.path===path);return field?row[field.name]:undefined};
        const name=String(get('name')??'').trim(),key=name.toLowerCase();
        const raw=smartNumber(get('raw_string')),current=smartNumber(get('value')),worst=smartNumber(get('worst')),threshold=smartNumber(get('thresh')),id=smartNumber(get('id'));
        if(id!==null&&id>=1&&id<=255&&threshold!==null&&threshold>0&&current!==null){
            checked=true;
            if(current<=threshold)flag('异常',`${name}：当前值 ${current} ≤ 阈值 ${threshold}`);
            else if(worst!==null&&worst<=threshold)flag('注意',`${name}：历史最差值 ${worst} ≤ 阈值 ${threshold}，当前值 ${current}`);
        }
        if(counters[key]&&raw!==null){
            checked=true;
            if(raw>0)flag(counters[key][0],`${counters[key][1]}：${raw}`);
        }
        if(['critical_warning','media_errors','percentage_used'].includes(key)){
            // NVMe 的命名属性有的直接把读数放在 value；ATA 的归一化 Current 不作 Raw 回退。
            const rawText=String(get('raw_string')??'').trim();
            const value=raw??(!rawText||rawText==='未获取'||rawText==='未提供'?current:null);
            if(value!==null){
                checked=true;
                if(key==='critical_warning'&&value>0)flag('异常',`NVMe 严重警告：${value}`);
                if(key==='media_errors'&&value>0)flag('异常',`NVMe 介质错误：${value}`);
                if(key==='percentage_used'&&value>=100)flag('注意',`NVMe 已用寿命：${value}%`);
            }
        }
    }
    if(status==='未检测'&&checked)status='正常';
    return {status,reasons,description:reasons.length?reasons.join('；'):checked?'已读取的 SMART 指标未触发风险条件':'缺少可判定的 SMART 数值'};
}

function evidenceView(file,onCollapse){const box=el('div'),log=el('div',undefined,'log wrap'),pageSize=logBatchSize();const known=new Map();for(const f of file.fragments)for(const l of f.lines){const old=known.get(l.number);if(old){old.hit ||= l.hit;old.ranges.push(...l.ranges)}else known.set(l.number,{...l,ranges:[...l.ranges]})}const entries=[...known.values()],render=(start=0,target=null)=>{log.replaceChildren();let previous=null;for(const l of entries.slice(start,start+pageSize)){const row=el('div',undefined,'line'+(l.hit?' hit':'')+(l.number===target?' target':''));row.dataset.line=l.number;row.append(el('span',String(l.number),'ln'),highlighted(l.text,l.ranges));log.append(row);previous=l.number}};render();box.revealLine=number=>{const i=entries.findIndex(l=>l.number===number);if(i>=0){render(Math.floor(i/pageSize)*pageSize,number);requestAnimationFrame(()=>log.querySelector('.target')?.scrollIntoView({block:'center',behavior:reducedMotion()?'auto':'smooth'}))}};box.stop=()=>{};box.start=()=>{};box.append(log);return box}
function selectRule(i,fileName,line){const item=indexes[i];if(!item)return;showSection('keywords');if(i!==selected){for(const f of currentFiles)f.view?.stop();selected=i;currentFiles=[];const area=$('findings');area.replaceChildren();area.append(el('div',catalogNames(item.f.rule.source_file_ids)+' / '+item.f.rule.name,'crumb'),el('h2',item.f.rule.name));
        if(item.f.rule.note&&item.f.rule.note!==item.f.rule.name)area.append(el('p',item.f.rule.note,'muted rule-note'));const actions=el('div',undefined,'actions rule-actions');actions.append(el('span',`${item.files.size} 个日志文件 · 共 ${item.f.count} 处匹配`,'panel-meta'),button('全部展开',()=>currentFiles.forEach(f=>{f.d.open=true;f.populate()})),button('全部收起',()=>currentFiles.forEach(f=>{f.d.open=false})));area.append(actions);
        const retained=[...item.files.values()].reduce((n,file)=>n+file.hits.size,0);if(item.f.count>retained)area.append(el('p',`共 ${item.f.count} 处匹配，报告保留 ${retained} 处，省略 ${item.f.count-retained} 处。搜索与打印仅覆盖保留证据，完整日志可在解压目录查看。`,'notice'));
        if(!item.files.size)area.append(el('p',item.f.status||'无匹配片段','notice'));
        for(const file of item.files.values()){const d=el('details',undefined,'file-group');d.dataset.file=file.name;const s=el('summary'),time=[...file.times].sort();s.title=sourceLabel(file.name);s.append(el('span','▸','file-arrow'),el('span',item.f.rule.name,'file-chip'),el('span',sourceLabel(file.name),'file-name'));s.append(el('small',`${file.hits.size} 个命中行 · 上下文行 ${file.min}–${file.max} · 最近片段 ${time.at(-1)||'时间未识别'} · ${item.f.status==='日志读取不完整'?'读取不完整':'已提取'}`));d.append(s);const body=el('div',undefined,'file-body');d.append(body);const state={d,file,view:null,populate(){if(state.view)return;const notes=[...new Set(file.fragments.map(f=>f.annotation).filter(Boolean))];notes.forEach(n=>body.append(el('p',n,'file-note')));body.append(el('p','来源：'+sourceLabel(file.name),'source muted'));state.view=evidenceView(file,()=>{d.open=false;s.focus()});body.append(state.view);}};d.ontoggle=()=>{if(d.open)state.populate();else if(state.view){state.view.stop();body.replaceChildren();state.view=null}};currentFiles.push(state);area.append(d)}
        const first=currentFiles[0];if(first&&(item.f.rule.open||report.layout.first_open)){first.d.open=true;first.populate()}
    }
    document.querySelectorAll('[data-rule]').forEach(b=>{const active=Number(b.dataset.rule)===i;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false');if(active)b.closest('.tree-group').open=true});document.querySelectorAll('[data-files]').forEach(n=>{n.hidden=Number(n.dataset.files)!==i;n.querySelectorAll('.file-link').forEach(b=>b.classList.toggle('active',Boolean(fileName&&b.dataset.file===fileName)));});
    if(fileName){const state=currentFiles.find(f=>f.file.name===fileName);if(state){state.d.open=true;state.populate();state.view.revealLine(line);state.d.scrollIntoView({block:'start'})}}
}
const sessionName=value=>({'Kernel Panic 重启':'系统崩溃后重启','Watchdog 重启':'系统无响应后自动重启','硬件复位':'设备发生硬件复位','疑似断电':'疑似断电','未知复位':'无法判断上次关机原因'}[value]||value);
const sessionKind=s=>['正常关机','正常重启'].includes(s.end_classification)?'normal':s.end_classification==='未知复位'?'unknown':'abnormal';
const sessionMatches=(group,s)=>group==='全部'||(group==='正常'&&sessionKind(s)==='normal')||(group==='可能异常'&&sessionKind(s)==='abnormal')||(group==='无法判断'&&sessionKind(s)==='unknown');
function compactTime(value){const text=String(value||''),full=text.match(/\d{4}-(\d\d)-(\d\d)[T ](\d\d):(\d\d)/);if(full)return `${full[1]}-${full[2]} ${full[3]}:${full[4]}`;const partial=text.match(/([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d\d):(\d\d)/),months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};return partial?`${months[partial[1]]}-${String(partial[2]).padStart(2,'0')} ${partial[3]}:${partial[4]}`:'时间无法确定'}
function fullTime(value,reference){const text=String(value||'');if(/^\d{4}-\d\d-\d\dT/.test(text))return text;const partial=text.match(/([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d\d:\d\d:\d\d)/),ref=String(reference||'').match(/^(\d{4})-\d\d-\d\dT.*?(Z|[+-]\d\d:\d\d)$/),months={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};return partial&&ref?`${ref[1]}-${months[partial[1]]}-${String(partial[2]).padStart(2,'0')}T${partial[3]}${ref[2]}`:text}
function sessionTime(s){const start=compactTime(s.incident_time_start||s.boot_time),end=s.incident_time_end?compactTime(s.incident_time_end):'';if(s.incident_time_precision==='unknown')return ['时间无法确定','检测到启动 '+compactTime(s.boot_time)];if(end&&end!==start){const suffix=end.slice(0,5)===start.slice(0,5)?end.slice(6):end;return ['约 '+start+'–'+suffix,'']}return [(s.incident_time_precision==='approximate'?'约 ':'')+start,'']}
const factName=type=>({boot:'系统启动',systemd_ready:'系统服务就绪',shutdown_request:'开始关机',shutdown_complete:'完成关机',reboot_request:'开始重启',reboot_complete:'完成重启',kernel_panic:'内核崩溃',watchdog_reset:'系统无响应复位',hardware_reset:'硬件复位',power_loss_hint:'电源中断线索',filesystem_recovery:'文件系统恢复',device_reenumeration:'硬盘重新识别',log_gap:'日志中断',reset_reason:'设备复位原因',evidence:'其他依据'}[type]||type);
function evidenceList(title,items){const box=el('div');box.append(el('h4',title));const list=el('ul');for(const item of items)list.append(el('li',item));box.append(list);return box}
function technicalEvidence(s){const details=el('details',undefined,'technical-evidence');details.append(el('summary','查看原始依据'));let loaded=false;details.ontoggle=()=>{if(!details.open||loaded)return;loaded=true;if(s.boot_id)details.append(el('p','boot_id：'+s.boot_id,'muted'));for(const e of s.facts){const fact=el('div',undefined,'technical-fact');fact.append(el('strong',compactTime(e.time)+' · '+factName(e.event_type)),el('p','原始事件类型：'+e.event_type+' · 证据等级：'+e.evidence_strength,'muted'));for(const source of e.sources){const raw=el('details');raw.append(el('summary',sourceLabel(source.file)+' · 行 '+source.lines[0]?.number));let sourceLoaded=false;raw.ontoggle=()=>{if(raw.open&&!sourceLoaded){sourceLoaded=true;raw.append(fragmentView(source))}};fact.append(raw)}details.append(fact)}};return details}
function showEvents(group){
    eventGroup=group;tabs($('event-tabs'),['全部','正常','可能异常','无法判断'],group,showEvents);$('events').replaceChildren();
    if(report.timeline_sessions?.length){
        const sessions=report.timeline_sessions.filter(s=>sessionMatches(group,s)),summary=el('div',undefined,'timeline-summary');
        const normal=report.timeline_sessions.filter(s=>sessionKind(s)==='normal').length,abnormal=report.timeline_sessions.filter(s=>sessionKind(s)==='abnormal').length,unknown=report.timeline_sessions.filter(s=>sessionKind(s)==='unknown').length;
        summary.append(el('p',`共 ${report.timeline_sessions.length} 条记录 · 正常 ${normal} · 可能异常 ${abnormal} · 无法判断 ${unknown}`,'muted'));
        for(const s of sessions){const card=el('article',undefined,'session-card '+sessionKind(s)),head=el('div',undefined,'session-head'),time=sessionTime(s),timeBox=el('div');const primary=el('div',time[0],'session-time'),reference=s.incident_time_end||s.boot_time;primary.title=[fullTime(s.incident_time_start||s.boot_time,reference),fullTime(s.incident_time_end,reference)].filter(Boolean).join(' 至 ');timeBox.append(primary);if(time[1])timeBox.append(el('small',time[1]));head.append(timeBox,el('strong',sessionName(s.end_classification),'session-result'));card.append(head);const details=el('details',undefined,'session-explanation'),body=el('div',undefined,'session-body');details.append(el('summary','查看详情'));if(s.supporting_evidence.length)body.append(evidenceList('为什么这样判断',s.supporting_evidence));body.append(el('p','判断把握：'+s.confidence));if(s.limitations.length)body.append(evidenceList('为什么不能完全确定',s.limitations));body.append(technicalEvidence(s));details.append(body);card.append(details);summary.append(card)}
        $('events').append(summary);if(!sessions.length)$('events').append(el('p','没有符合当前筛选的记录','muted'));
    } else $('events').append(el('p','无法形成开关机记录，可在下方查看原始依据','muted'));
    const raw=el('details',undefined,'raw-timeline');raw.append(el('summary','查看未整理的原始事件'));const list=el('div',undefined,'timeline');let date='';report.events.forEach((e,i)=>{const day=e.key?e.time.slice(0,10):'时间未识别';if(day!==date){date=day;list.append(el('div',day,'date'))}const item=el('div',undefined,'event');item.id='event-'+i;item.append(el('strong',e.time+' · '+e.name),el('p',e.note,'muted'));const d=el('details');d.append(el('summary','日志依据 · '+e.sources.length+' 处来源'));let loaded=false;const views=[];const populate=()=>{if(loaded)return;loaded=true;for(const s of e.sources){const v=fragmentView(s);views.push(v);d.append(el('small',sourceLabel(s.file),'source'),v)}};d.ontoggle=()=>{if(d.open)populate()};item.reveal=(file,line)=>{d.open=true;populate();const j=e.sources.findIndex(s=>s.file===file&&s.lines.some(l=>l.number===line));if(j>=0)views[j].revealLine(line)};item.append(d);list.append(item)});raw.append(list);$('events').append(raw)
}
function openEvent(i,file,line){showEvents('全部');showSection('timeline');const n=$('event-'+i);n.closest('.raw-timeline').open=true;n.reveal(file,line);n.scrollIntoView({block:'start'});requestAnimationFrame(()=>n.querySelector('.target')?.scrollIntoView({block:'center'}))}
// 搜索遍历数据而不是 DOM，因此折叠状态和当前渲染批次不会漏掉结果。
let searchRun=0;
async function search(){const run=++searchRun,q=$('search').value.trim().toLocaleLowerCase(),out=$('search-results');out.replaceChildren();if(!q)return;if(!ready){out.append(el('p','目录仍在整理，请稍后搜索。'));return}const matches=[],contains=v=>String(v||'').toLocaleLowerCase().includes(q);out.append(el('p','正在搜索…'));let work=0;
    for(const t of report.system){if(contains(t.name)||contains(sourceLabel(t.source))||contains(JSON.stringify(t.rows)))matches.push(['系统信息 · '+t.name,sourceLabel(t.source),()=>openSystem()])}
    for(const [i,item] of indexes.entries()){if(item.f.rule.target==='timeline')continue;const named=contains(item.f.rule.name)||contains(item.f.rule.note)||contains(catalogNames(item.f.rule.source_file_ids));let found=false;for(const file of item.files.values()){const fileMatch=contains(sourceLabel(file.name));let matchLine;for(const f of file.fragments){for(const l of f.lines){if(matchLine===undefined&&contains(l.text))matchLine=l.number;if(++work%5000===0){await nextFrame();if(run!==searchRun)return}}}if(fileMatch||matchLine!==undefined){found=true;matches.push(['规则 · '+item.f.rule.name,sourceLabel(file.name)+(matchLine!==undefined?' · 行 '+matchLine:''),()=>selectRule(i,file.name,matchLine)])}}if(named&&!found)matches.push(['规则 · '+item.f.rule.name,item.f.status,()=>{if(!item.f.count){$('show-empty').checked=true;buildNavigation()}selectRule(i)}]);await nextFrame();if(run!==searchRun)return}
    report.events.forEach((e,i)=>{const source=e.sources.find(s=>contains(sourceLabel(s.file))||s.lines.some(l=>contains(l.text)));if(contains(e.name)||contains(e.note)||contains(e.time)||source)matches.push(['时间线 · '+e.time+' '+e.name,source?sourceLabel(source.file):eventLabels(e).join('、'),()=>openEvent(i,source?.file,source?.lines.find(l=>contains(l.text))?.number)])});if(run!==searchRun)return;
    out.replaceChildren(el('p',matches.length+' 个匹配位置'));let at=0;const more=button('显示更多结果',render);function render(){more.remove();for(const [label,detail,fn] of matches.slice(at,at+50)){const b=button(label,fn);b.append(el('small',detail));out.append(b)}at+=50;if(at<matches.length)out.append(more)}render();
}
$('search-button').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};$('clear-search').onclick=()=>{searchRun++;$('search').value='';$('search-results').replaceChildren()};
// 打印当前规则时从数据构建完整证据，避免浏览器只打印已经展开或加载的一批日志。
function preparePrint(){const out=$('print-content');out.replaceChildren();if(activeSection==='keywords'&&selected>=0){const item=indexes[selected];out.append(el('h2',item.f.rule.name),el('p',item.f.rule.note),el('p',item.f.status));const retained=[...item.files.values()].reduce((n,f)=>n+f.hits.size,0);out.append(el('p',`总匹配 ${item.f.count} 处 · 保留 ${retained} 处 · 省略 ${Math.max(0,item.f.count-retained)} 处`));for(const file of item.files.values()){const part=el('div',undefined,'print-file');part.append(el('h3',sourceLabel(file.name)),el('p','片段时间：'+timeSpan([...file.times].sort())));[...new Set(file.fragments.map(f=>f.annotation).filter(Boolean))].forEach(n=>part.append(el('p',n)));const lines=new Map();for(const f of file.fragments)for(const l of f.lines){const old=lines.get(l.number);if(old){old.hit ||= l.hit;old.ranges.push(...l.ranges)}else lines.set(l.number,{...l,ranges:[...l.ranges]})}const log=el('div',undefined,'log wrap');let previous=null;for(const l of [...lines.values()]){if(previous!==null&&l.number!==previous+1)log.append(el('div','… 非连续上下文 …'));const row=el('div',undefined,'line'+(l.hit?' hit':''));row.append(el('span',String(l.number),'ln'),highlighted(l.text,l.ranges));log.append(row);previous=l.number}part.append(log);out.append(part)}}else if(activeSection==='timeline'){out.append(el('h2',report.layout.timeline_title));for(const s of (report.timeline_sessions||[]).filter(s=>sessionMatches(eventGroup,s))){const time=sessionTime(s)[0];out.append(el('h3',time+' · '+sessionName(s.end_classification)),el('p','判断把握：'+s.confidence));if(s.supporting_evidence.length)out.append(evidenceList('为什么这样判断',s.supporting_evidence));if(s.limitations.length)out.append(evidenceList('为什么不能完全确定',s.limitations));if(s.boot_id)out.append(el('p','boot_id：'+s.boot_id));for(const e of s.facts){out.append(el('h4',e.time+' · '+factName(e.event_type)),el('p','原始事件类型：'+e.event_type+' · 证据等级：'+e.evidence_strength));for(const source of e.sources)out.append(el('p',sourceLabel(source.file)),el('pre',source.lines.map(line=>line.number+' '+line.text).join('\n')))}}}else{const source=$(activeSection).cloneNode(true);source.hidden=false;source.querySelectorAll('button').forEach(b=>b.remove());source.querySelectorAll('details').forEach(d=>d.open=true);out.append(source)}}
window.addEventListener('beforeprint',preparePrint);window.addEventListener('afterprint',()=>$('print-content').replaceChildren());
